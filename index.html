<!DOCTYPE html>
<html lang="id">
<head>
    <title>Latihan Web02
    </title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="form-container">
        <form action="#" method="POST">
            <table>
                <tr>
                    <!--Row 1, Column 1 (Kiri)-->
                    <td class="label-col"><label>Name:</label></td>
                    <!--Row 1, Column 2 (Kanan)-->
                    <td><input type="text" id="name" name="name" value="you name here"></td>
                </tr>
                <tr>
                    <!--Row 2, Column 1 (Kiri)-->
                    <td class="label-col"><label>Email:</label></td>
                    <!--Row 2, Column 2 (Kanan)-->
                    <td><input type="text" id="email" name="email" value="your email here"></td>
                </tr>
                <tr>
                    <!--Row 3, Column 1 (Kiri)-->
                    <td class="label-col"><label>Address:</label></td>
                    <!--Row 3, Column 2 (Kanan)-->
                    <td>
                        <textarea id="address" name="address">25 Nowhere Street
Somewhere
Not Here
Y2K 5RU</textarea>
                    </td>
                </tr>
                <tr>
                    <!--Row 4, Column 1 (Kiri)-->
                    <td class="label-col"><label>Postcode:</label></td>
                    <!--Row 4, Column 2 (Kanan)-->
                    <td><input type="text" id="postcode" name="postcode" value="postal code"></td>
                </tr>
            </table>
        </form>
    </div>

</body>
</html>
